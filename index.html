
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gram Bazaar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f8f1;
}

header {
  background: #168044;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.search {
  text-align: center;
  padding: 20px;
}

input {
  padding: 12px;
  width: 80%;
  max-width: 400px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin: 5px;
}

button {
  padding: 10px 16px;
  background: #168044;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin: 5px;
}

button:hover {
  background: #105d31;
}

h2 {
  text-align: center;
  color: #168044;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ddd;
}

.card .emoji {
  font-size: 55px;
}

.product-image {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 10px;
}

.price {
  color: #168044;
  font-weight: bold;
}

footer {
  background: #168044;
  color: white;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>🌾 Gram Bazaar</h1>
  <p>Apne Gaon Ka Apna Bazaar</p>
</header>

<div class="search">
  <input
    type="text"
    id="search"
    placeholder="सामान खोजें..."
    oninput="showProducts()">

  <button onclick="showCart()">🛒 Cart</button>
</div>

<h2>हमारे स्थानीय सामान</h2>

<div class="products" id="products"></div>

<h2>नया सामान बेचें</h2>

<div class="search">
  <input id="name" placeholder="सामान का नाम">
  <input id="price" type="number" placeholder="कीमत ₹">
  <input id="seller" placeholder="दुकानदार का नाम">
  <button onclick="addProduct()">सामान जोड़ें</button>
</div>

<h2>आपका Cart</h2>
<div id="cart" style="text-align:center; padding:15px;"></div>

<footer>
  <p>© 2026 Gram Bazaar | Local Products, Local Business</p>
</footer>

<script>

let products = [


{
  name: "ताजा टमाटर",
  price: 30,
  image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_8wrmHMwCaFAG2A9t2tt6Sjfw4NoBlRwj-KtRPEiNeW-G6rrIzA3CNqI&s=10",
  seller: "राम किसान",
  village: "सीतापुर",
  category: "सब्जियां"
},



{
  name: "आलू",
  price: 25,
  image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiyBIMxrwPHlx0oix3c57mYlYl8Qwf-oqjWtNFFQR4Y7xVOuESLlGNiiT_&s=10",
  seller: "श्याम किसान",
  village: "सीतापुर",
  category: "सब्जियां"
},


  {
    name: "चावल",
    price: 55,
    image: "https://media.istockphoto.com/id/153737841/photo/rice.jpg?s=612x612&w=0&k=20&c=lfO7iLT0UsDDzra0uBOsN1rvr2d5OEtrG2uwbts33_c=",
    seller: "मोहन किसान",
    village: "सीतापुर",
    category: "दाल और अनाज"
  },

  {
    name: "दाल",
    price: 90,
    image: "https://t3.ftcdn.net/jpg/10/29/44/94/360_F_1029449403_nKNaUWyT9qxxac8gLk8PENcq2vFAaRJj.jpg",
    seller: "राम किसान",
    village: "सीतापुर",
    category: "दाल और अनाज"
  },

  {
    name: "मक्का",
    price: 35,
    image: "https://thumbs.dreamstime.com/b/ears-sweet-corn-10746409.jpg",
    seller: "रवि किसान",
    village: "सीतापुर",
    category: "अनाज"
  },

  
{
  name: "गेहूं",
  price: 40,
  image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtcRV2_cKZ5VXbXCXWG_x9nfTqt1RKeSXrasho9m5enw&s=10",
  seller: "रवि किसान",
  village: "सीतापुर",
  category: "अनाज"
},


  {
    name: "दूध",
    price: 50,
    emoji: "🥛",
    seller: "सुरेश डेयरी"
  },

  
{
  name: "झाड़ू",
  price: 40,
  image: "https://citybazaarstore.com/wp-content/uploads/2024/08/616o2eI5I3L._SL1500_.jpg",
  seller: "स्थानीय विक्रेता",
  village: "सीतापुर",
  category: "घरेलू सामान"
},


];

let cart = [];

function showProducts() {

  let search = document.getElementById("search")
    .value.toLowerCase();

  let box = document.getElementById("products");

  box.innerHTML = "";

  products.filter(p =>
    p.name.toLowerCase().includes(search)
  ).forEach(p => {

    let index = products.indexOf(p);

    box.innerHTML += `
      <div class="card">

        ${
          p.image
          ? `<img
              class="product-image"
              src="${p.image}"
              alt="${p.name}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
             <div class="emoji" style="display:none;">📦</div>`
          : `<div class="emoji">${p.emoji || "📦"}</div>`
        }

        <h3>${p.name}</h3>

        <p class="price">₹${p.price}</p>

        <p>विक्रेता: ${p.seller}</p>

        <button onclick="addCart(${index})">
          Add to Cart
        </button>

      </div>
    `;

  });

}

function addCart(index) {

  cart.push(products[index]);

  alert("सामान Cart में जोड़ दिया गया!");

  showCart();

}

function showCart() {

  let box = document.getElementById("cart");

  box.innerHTML = "";

  let total = 0;

  cart.forEach(p => {

    total += Number(p.price);

    box.innerHTML += `
      <p>${p.name} - ₹${p.price}</p>
    `;

  });

  box.innerHTML += `<h3>कुल कीमत: ₹${total}</h3>`;

}

function addProduct() {

  let name = document.getElementById("name").value.trim();

  let price = Number(document.getElementById("price").value);

  let seller = document.getElementById("seller").value.trim();

  if (!name || price <= 0 || !seller) {

    alert("कृपया सभी जानकारी सही भरें!");

    return;

  }

  products.push({

    name: name,
    price: price,
    seller: seller,
    emoji: "📦"

  });

  showProducts();

  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("seller").value = "";

  alert("आपका सामान जोड़ दिया गया!");

}

showProducts();

</script>

</body>
</html>
