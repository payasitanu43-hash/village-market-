
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gram Bazaar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f8f1;
}

header {
  background: #168044;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.search {
  text-align: center;
  padding: 20px;
}

input {
  padding: 12px;
  width: 80%;
  max-width: 400px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin: 5px;
}

button {
  padding: 10px 16px;
  background: #168044;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin: 5px;
}

button:hover {
  background: #105d31;
}

h2 {
  text-align: center;
  color: #168044;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ddd;
}

.card .emoji {
  font-size: 55px;
}

.price {
  color: #168044;
  font-weight: bold;
}

footer {
  background: #168044;
  color: white;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>🌾 Gram Bazaar</h1>
  <p>Apne Gaon Ka Apna Bazaar</p>
</header>

<div class="search">
  <input
    type="text"
    id="search"
    placeholder="सामान खोजें..."
    oninput="showProducts()">
  <button onclick="showCart()">🛒 Cart</button>
</div>

<h2>हमारे स्थानीय सामान</h2>

<div class="products" id="products"></div>

<h2>नया सामान बेचें</h2>

<div class="search">
  <input id="name" placeholder="सामान का नाम">
  <input id="price" type="number" placeholder="कीमत ₹">
  <input id="seller" placeholder="दुकानदार का नाम">
  <button onclick="addProduct()">सामान जोड़ें</button>
</div>

<h2>आपका Cart</h2>
<div id="cart"></div>

<footer>
  <p>© 2026 Gram Bazaar | Local Products, Local Business</p>
</footer>

<script>

let products = [
  {name:"ताजा टमाटर", price:30, emoji:"🍅", seller:"राम किसान"},
  {name:"आलू", price:25, emoji:"🥔", seller:"श्याम किसान"},
  {name:"ताजा आम", price:60, emoji:"🥭", seller:"मोहन किसान"},
  {name:"गेहूं", price:40, emoji:"🌾", seller:"रवि किसान"},
  {name:"दूध", price:50, emoji:"🥛", seller:"सुरेश डेयरी"},
  {name:"शहद", price:120, emoji:"🍯", seller:"स्थानीय विक्रेता"}
];

let cart = [];

function showProducts() {
  let search = document.getElementById("search")
    .value.toLowerCase();

  let box = document.getElementById("products");
  box.innerHTML = "";

  products.filter(p =>
    p.name.toLowerCase().includes(search)
  ).forEach((p, index) => {
    box.innerHTML += `
      <div class="card">
        <div class="emoji">${p.emoji || "📦"}</div>
        <h3>${p.name}</h3>
        <p class="price">₹${p.price}</p>
        <p>विक्रेता: ${p.seller}</p>
        <button onclick="addCart(${index})">
          Add to Cart
        </button>
      </div>
    `;
  });
}

function addCart(index) {
  cart.push(products[index]);
  alert("सामान Cart में जोड़ दिया गया!");
  showCart();
}

function showCart() {
  let box = document.getElementById("cart");
  box.innerHTML = "";

  let total = 0;

  cart.forEach(p => {
    total += Number(p.price);
    box.innerHTML += `
      <p>${p.name} - ₹${p.price}</p>
    `;
  });

  box.innerHTML += `<h3>कुल कीमत: ₹${total}</h3>`;
}

function addProduct() {
  let name = document.getElementById("name").value;
  let price = Number(document.getElementById("price").value);
  let seller = document.getElementById("seller").value;

  if (!name || price <= 0 || !seller) {
    alert("कृपया सभी जानकारी सही भरें!");
    return;
  }

  products.push({
    name: name,
    price: price,
    seller: seller,
    emoji: "📦"
  });

  showProducts();

  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("seller").value = "";

  alert("आपका सामान जोड़ दिया गया!");
}

showProducts();

</script>
</body>
</html>
